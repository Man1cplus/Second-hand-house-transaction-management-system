spring:
  application:
    name: SecondHandHouseBackend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/SecondHandHouse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  servlet:
    multipart:
      max-file-size: 10MB  # 单个文件最大大小（支持合同文件上传）
      max-request-size: 15MB  # 请求最大大小

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 默认枚举类型处理器
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    # 是否开启 MyBatis 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 是否开启自动驼峰命名规则映射
    map-underscore-to-camel-case: true

  # 全局配置
  global-config:
    db-config:
      # 主键类型
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 逻辑删除值
      logic-delete-value: 1

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /  # 根路径

# JWT配置
jwt:
  secret: SecondHandHouseSecretKeyForJWTTokenGeneration2024  # JWT密钥，生产环境请修改为更安全的密钥
  expiration: 86400000  # Token过期时间（毫秒），默认24小时

# 文件上传配置
file:
  upload-dir: uploads  # 文件上传目录